name: Static checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify local references resolve
        run: |
          python3 - <<'EOF'
          import os, re, sys
          errors = []
          for root, _dirs, files in os.walk("."):
              for fname in files:
                  if not fname.endswith(".html"):
                      continue
                  path = os.path.join(root, fname)
                  html = open(path, encoding="utf-8").read()
                  # local hrefs and srcs only (skip anchors, mailto, http)
                  for attr in ("href", "src"):
                      for m in re.finditer(attr + r'="(\./|\.\./|/)[^"]*"', html):
                          target = m.group(1)
                          if target.startswith(("mailto:", "http", "#")):
                              continue
                          ref = os.path.normpath(os.path.join(os.path.dirname(path), target))
                          if target.endswith((".html", ".css", ".js", ".png", ".svg", ".ico")):
                              if not os.path.exists(ref):
                                  errors.append(f"{path}: missing {target}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("OK: all local references resolve")
          EOF
