<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projects — Nick Coles</title>
<meta name="description" content="Projects by Nick Coles.">
<meta name="theme-color" content="#f8f8f8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f8f8f8'/%3E%3Ctext x='16' y='22' font-family='Georgia, serif' font-size='20' text-anchor='middle' fill='%230a0a0a'%3EN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f8f8f8;
    --ink: #0a0a0a;
    --muted: #8a877f;
    --line: #d8d5cf;
    --serif: "EB Garamond", "Georgia", "Times New Roman", serif;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    font-weight: 400;
    font-size: 1.2rem;
    line-height: 1.6;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(1.5rem, 6vw, 4rem);
    font-feature-settings: "liga" 1, "kern" 1, "calt" 1;
    -webkit-font-smoothing: antialiased;
  }

  h1 {
    font-weight: 500;
    font-size: clamp(2rem, 6vw, 3rem);
    margin: 0 0 1.5rem;
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 0.1em;
    font-size: 1.25rem;
    transition: border-color 0.2s ease;
  }
  a:hover { border-color: var(--ink); }

  .back {
    margin-top: 3rem;
    font-size: 0.95rem;
    color: var(--muted);
  }
  .back a { color: var(--muted); font-size: 0.95rem; }

  ::selection { background: var(--ink); color: var(--paper); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <h1>Projects</h1>
  <ul>
    <li><a href="/tracemark/">TraceMark</a></li>
  </ul>
  <p class="back"><a href="/">&larr; Nick Coles</a></p>
</body>
</html>
